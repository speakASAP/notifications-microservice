apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: notifications-microservice-secret
  namespace: statex-apps
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: notifications-microservice-secret
    creationPolicy: Owner
  data:
    - secretKey: AWS_SES_ACCESS_KEY_ID
      remoteRef:
        key: secret/prod/notifications-microservice
        property: AWS_SES_ACCESS_KEY_ID
    - secretKey: AWS_SES_SECRET_ACCESS_KEY
      remoteRef:
        key: secret/prod/notifications-microservice
        property: AWS_SES_SECRET_ACCESS_KEY
    - secretKey: DB_PASSWORD
      remoteRef:
        key: secret/prod/notifications-microservice
        property: DB_PASSWORD
    - secretKey: JWT_SECRET
      remoteRef:
        key: secret/prod/auth-microservice
        property: JWT_SECRET
    - secretKey: SERVICE_TOKEN
      remoteRef:
        key: secret/prod/notifications-microservice
        property: SERVICE_TOKEN
    - secretKey: CLIPLOT_NOTIFICATIONS_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/cliplot
        property: NOTIFICATIONS_SERVICE_TOKEN
    - secretKey: INVOICES_NOTIFICATIONS_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/invoices-microservice
        property: NOTIFICATIONS_SERVICE_TOKEN
    # Same convention as cliplot/invoices above: the token lives in the CONSUMER's
    # Vault path, so there is exactly one copy and the two sides cannot drift.
    - secretKey: SPEAKASAP_NOTIFICATIONS_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/speakasap/notification
        property: NOTIFICATIONS_SERVICE_TOKEN
    # cv-tuning mints nothing of its own here: the token is stored once at the CALLER's
    # Vault path and referenced by both sides, so the two cannot drift apart.
    - secretKey: CV_TUNING_NOTIFICATIONS_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/cv-tuning
        property: NOTIFICATIONS_SERVICE_TOKEN
    - secretKey: PAYMENT_API_KEY
      remoteRef:
        key: secret/prod/notifications-microservice
        property: PAYMENT_API_KEY
    - secretKey: PAYMENT_APPLICATION_ID
      remoteRef:
        key: secret/prod/notifications-microservice
        property: PAYMENT_APPLICATION_ID
    - secretKey: PAYMENT_WEBHOOK_API_KEY
      remoteRef:
        key: secret/prod/notifications-microservice
        property: PAYMENT_WEBHOOK_API_KEY
    - secretKey: SENDGRID_API_KEY
      remoteRef:
        key: secret/prod/notifications-microservice
        property: SENDGRID_API_KEY
    - secretKey: TELEGRAM_BOT_TOKEN
      remoteRef:
        key: secret/prod/notifications-microservice
        property: TELEGRAM_BOT_TOKEN
    - secretKey: WHATSAPP_ACCESS_TOKEN
      remoteRef:
        key: secret/prod/notifications-microservice
        property: WHATSAPP_ACCESS_TOKEN
    # TASK-KEY-F2: outbound credential used by OrchestratorClient to call runlayer.
    # Was a second copy of the shared SERVICE_TOKEN value. runlayer's guard accepts its
    # own NOTIFICATIONS_SERVICE_TOKEN, so point at that single canonical copy instead of
    # keeping a duplicate here.
    - secretKey: ORCHESTRATOR_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/runlayer
        property: NOTIFICATIONS_SERVICE_TOKEN
    - secretKey: AI_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/notifications-microservice
        property: AI_SERVICE_TOKEN

    # TASK-KEY-F2: these five callers previously authenticated with the shared
    # SERVICE_TOKEN, which resolves to global:superadmin. Each now has its own
    # delivery-scoped token, stored in the CONSUMER's path per the convention above
    # so there is exactly one copy and the two sides cannot drift.
    - secretKey: AUTH_NOTIFICATIONS_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/auth-microservice
        property: NOTIFICATIONS_SERVICE_TOKEN
    - secretKey: MARKETING_NOTIFICATIONS_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/marketing-microservice
        property: NOTIFICATIONS_SERVICE_TOKEN
    - secretKey: MONITORING_NOTIFICATIONS_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/monitoring-microservice
        property: NOTIFICATIONS_SERVICE_TOKEN
    - secretKey: LEADS_NOTIFICATIONS_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/leads-microservice
        property: NOTIFICATIONS_SERVICE_TOKEN
    - secretKey: DOMAIN_RESEARCH_NOTIFICATIONS_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/domain-research
        property: NOTIFICATIONS_SERVICE_TOKEN
    - secretKey: RUNLAYER_NOTIFICATIONS_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/runlayer
        property: NOTIFICATIONS_SERVICE_TOKEN
